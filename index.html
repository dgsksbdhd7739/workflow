<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WorkFlow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />
    <title>WorkFlow</title>
    <script>
      try {
        const gespeichert = localStorage.getItem('theme')
        const dunkel = gespeichert ? gespeichert === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dunkel) document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" style="display: flex; height: 100vh; flex-direction: column; gap: 0.75rem; align-items: center; justify-content: center; background: var(--color-bg, #f8fafc)">
        <div
          style="
            display: flex;
            height: 3rem;
            width: 3rem;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            background: linear-gradient(135deg, #4f46e5, #2563eb);
            box-shadow: 0 4px 16px -4px rgba(79, 70, 229, 0.5);
          "
        >
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 18a8 8 0 0 1 16 0Z" />
            <path d="M4 18h16" />
            <path d="M12 10v-3" />
          </svg>
        </div>
        <div style="font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; font-weight: 800; font-size: 1.25rem; letter-spacing: -0.02em; color: var(--color-text, #0f172a)">
          Work<span style="background: linear-gradient(90deg, #4f46e5, #2563eb); -webkit-background-clip: text; background-clip: text; color: transparent">Flow</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
