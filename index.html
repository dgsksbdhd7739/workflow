<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ea580c" />
    <title>Baustellenapp</title>
    <script>
      try {
        const gespeichert = localStorage.getItem('theme')
        const dunkel = gespeichert ? gespeichert === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dunkel) document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
